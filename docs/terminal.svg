  <text x="380" y="23" fill="#9198a1" font-size="12" text-anchor="middle">Terminal</text>

  <g fill="#e6edf3" xml:space="preserve" style="white-space: pre">
    <text x="20" y="66"><tspan fill="#3fb950">$</tspan> claude-chrome init</text>
