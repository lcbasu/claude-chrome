    <text y="218" fill="#e6edf3"><tspan x="20">alice</tspan><tspan x="240">Claude Alice</tspan><tspan x="430" fill="#3fb950">installed</tspan></text>
    <text y="240" fill="#e6edf3"><tspan x="20">bob</tspan><tspan x="240">Claude Bob</tspan><tspan x="430" fill="#3fb950">installed</tspan></text>
