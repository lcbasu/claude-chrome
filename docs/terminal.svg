<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" role="img" aria-label="Terminal: brew install lcbasu/tap/claude-chrome and claude-chrome, then a table of Claude profiles with extension and pairing status">
  <rect width="760" height="368" rx="12" fill="#161b22"/>
  <rect width="760" height="36" rx="12" fill="#21262d"/>
  <rect y="24" width="760" height="12" fill="#21262d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="380" y="23" fill="#9198a1" font-size="12" text-anchor="middle">Terminal</text>

  <g fill="#e6edf3">
    <text x="20" y="66"><tspan fill="#3fb950">$</tspan> brew install lcbasu/tap/claude-chrome &amp;&amp; claude-chrome</text>
    <text x="20" y="90" fill="#9198a1">added 5 profile(s) to ~/.claude-instances/chrome-map.tsv</text>
    <text x="20" y="110" fill="#9198a1">hooked 5 launcher(s)</text>

    <text y="142" fill="#9198a1"><tspan x="20">SLUG</tspan><tspan x="190">CHROME_PROFILE</tspan><tspan x="380">EXTENSION</tspan><tspan x="520">PAIRED</tspan></text>
    <text y="164"><tspan x="20">alice</tspan><tspan x="190">Claude Alice</tspan><tspan x="380" fill="#3fb950">installed</tspan><tspan x="520" fill="#3fb950">yes</tspan></text>
    <text y="186"><tspan x="20">bob</tspan><tspan x="190">Claude Bob</tspan><tspan x="380" fill="#3fb950">installed</tspan><tspan x="520" fill="#9198a1">no</tspan></text>
    <text y="208"><tspan x="20">work01</tspan><tspan x="190">Claude Work 01</tspan><tspan x="380" fill="#3fb950">installed</tspan><tspan x="520" fill="#9198a1">no</tspan></text>
    <text y="230"><tspan x="20">work02</tspan><tspan x="190">Claude Work 02</tspan><tspan x="380" fill="#d29922">missing</tspan><tspan x="520" fill="#9198a1">no</tspan></text>
    <text y="252"><tspan x="20">research</tspan><tspan x="190">Claude Research</tspan><tspan x="380" fill="#d29922">missing</tspan><tspan x="520" fill="#9198a1">no</tspan></text>

    <text x="20" y="286">Opened 2 Chrome window(s). In each one:</text>
    <text x="36" y="308">1. Click "Add to Chrome".</text>
    <text x="36" y="330">2. Sign the extension into the Claude account named on the window.</text>
    <text x="20" y="352" fill="#9198a1">Run claude-chrome again any time to check.</text>
  </g>
</svg>
